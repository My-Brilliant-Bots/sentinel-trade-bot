description = "Multi-agent S&P 500 scanner using AutoGen and Alpha Vantage"
readme = "README.md"
dependencies = [
    "autogen-agentchat[cerebras,long-context]~=0.2",
    "autogen-ext[ollama,openai]>=0.4.0",
    "alpha_vantage",
    "pandas",
    "python-dotenv",
    "yfinance",
    "yoptions",
    "pandas-ta>=0.4.71b0",
    "lxml>=6.0.2",
    "numpy>=2.2.6",
    "requests>=2.32.5",
    "groq>=1.0.0",
    "gradio>=6.2.0",
    "markdown>=3.10",
    "scipy>=1.16.3",
    "duckduckgo-search>=8.1.1",
    "tenacity>=9.1.2",
    "ddgs>=9.10.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
]
